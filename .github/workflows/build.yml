name: PhotoKB build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/supabase-auth"]

permissions:
  contents: read

concurrency:
  group: photokb-build-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Build
        run: npm run build
